name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, to catch a new core release that breaks an example

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck examples/*.sh examples/ci/deploy.sh scripts/*.sh

  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/install-ov.sh "$RUNNER_TEMP/bin"
      - name: Every script prints its usage without arguments
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          for s in first-program hosted-account vaults-and-sharing rotate share-links; do
            if "examples/$s.sh" >/dev/null 2>&1; then echo "$s ran without arguments" && exit 1; fi
          done
